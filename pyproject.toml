[tool.ruff]
line-length    = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "F",    # pyflakes
  "E",    # pycodestyle
  "B",    # bugbear
  "C4",   # comprehensions
  "I",    # import-order
  "UP",   # pyupgrade
  "ARG",  # unused-arguments
  "D",    # docstrings
  "PL",   # available Pylint ports
]
ignore = ["E501"]    # let Black handle line length

[tool.black]
line-length = 88
target-version = ["py312"]
