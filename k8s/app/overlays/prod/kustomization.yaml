apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ant
resources:
  - ../../base
images:
  - name: ant-fileserver
    newName: ghcr.io/allie-leth/ant-fileserver
    newTag: latest
configMapGenerator:
  - name: ant-fileserver-config
    behavior: merge
    literals:
      - LOG_LEVEL=info
      - FLASK_ENV=production
      - STORAGE_ENDPOINT=https://minio.example.com
      - STORAGE_BUCKET=ant-fileserver-prod
replicas:
  - name: ant-fileserver
    count: 2
