apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ant-fileserver
  labels:
    app: ant-fileserver
    app.kubernetes.io/name: ant-fileserver
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ant-firmware
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ant-fileserver
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes (more conservative)
      policies:
      - type: Percent
        value: 25  # Scale down by max 25% of current replicas
        periodSeconds: 120
      - type: Pods
        value: 1   # But at least 1 pod at a time
        periodSeconds: 120
      selectPolicy: Min  # Choose the policy that scales down slower
    scaleUp:
      stabilizationWindowSeconds: 30   # 30 seconds (faster response)
      policies:
      - type: Percent
        value: 100  # Double the pods if needed
        periodSeconds: 60
      - type: Pods
        value: 4    # But max 4 pods at a time
        periodSeconds: 60
      selectPolicy: Max  # Choose the policy that scales up faster