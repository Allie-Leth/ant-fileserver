apiVersion: v1
kind: Secret
metadata:
  name: ant-fileserver-secrets
  namespace: ant-prod
type: Opaque
stringData:
  # MinIO credentials for production - USE SEALED SECRETS IN REAL DEPLOYMENT
  STORAGE_ACCESS_KEY_ID: "REPLACE_WITH_SEALED_SECRET"
  STORAGE_SECRET_ACCESS_KEY: "REPLACE_WITH_SEALED_SECRET"
  STORAGE_REGION: "us-east-1"
  # JWT secret for the application - USE SEALED SECRETS IN REAL DEPLOYMENT
  JWT_SECRET_KEY: "production-jwt-secret-key-use-sealed-secrets"