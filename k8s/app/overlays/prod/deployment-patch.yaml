apiVersion: apps/v1
kind: Deployment
metadata:
  name: ant-fileserver
spec:
  template:
    spec:
      # Required anti-affinity for production - spread across nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - ant-fileserver
            topologyKey: kubernetes.io/hostname
      # Tighter security for production
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
      - name: ant-fileserver
        # Production resources
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        # Production environment variables
        env:
        - name: PROMETHEUS_METRICS_ENABLED
          value: "true"
        - name: LOG_LEVEL
          value: "warning"
        # Tighter probe timings for production
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 2