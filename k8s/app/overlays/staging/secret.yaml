apiVersion: v1
kind: Secret
metadata:
  name: ant-fileserver-secrets
  namespace: ant-staging
type: Opaque
stringData:
  # MinIO credentials for staging
  STORAGE_ACCESS_KEY_ID: "REPLACE_WITH_ACTUAL_ACCESS_KEY"
  STORAGE_SECRET_ACCESS_KEY: "REPLACE_WITH_ACTUAL_SECRET_KEY"
  STORAGE_REGION: "us-east-1"
  # JWT secret for the application
  JWT_SECRET_KEY: "staging-jwt-secret-key-change-me"