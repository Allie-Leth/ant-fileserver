apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ant-fileserver
  labels:
    app: ant-fileserver
    app.kubernetes.io/name: ant-fileserver
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ant-firmware
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ant-fileserver
  # Allow eviction of unhealthy pods to prevent blocking node maintenance
  unhealthyPodEvictionPolicy: AlwaysAllow