apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ant-fileserver
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare-prod
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-burst: "200"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.scopecreep.productions
    secretName: ant-fileserver-tls
  rules:
  - host: api.scopecreep.productions
    http:
      paths:
      - path: /api/v1/firmware/(.*)
        pathType: Prefix
        backend:
          service:
            name: ant-fileserver
            port:
              number: 80