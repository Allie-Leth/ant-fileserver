apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ant-local

resources:
  - ../../base

images:
  - name: ant-fileserver
    newName: ant-fileserver
    newTag: test

configMapGenerator:
  - name: ant-fileserver-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - FLASK_ENV=development
      - STORAGE_ENDPOINT=http://minio.minio.svc.cluster.local:9000
      - STORAGE_BUCKET=ant-fileserver-dev
      - STORAGE_REGION=us-east-1

# Remove NetworkPolicy for easier local testing
patches:
  - path: delete-networkpolicy.yaml