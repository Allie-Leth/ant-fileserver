########################################
#      GLOBAL CONFIG & VARIABLES
########################################
stages:
  - lint
  - unit
  - api
  - integration
  - build
  - deploy

variables:
  # Point all build/push/pull to the cluster-internal registry Service
  INTERNAL_REGISTRY: gitlab-registry.gitlab.svc.cluster.local:5000
  INTERNAL_IMAGE: $INTERNAL_REGISTRY/$CI_PROJECT_PATH

########################################
#            LINT STAGE
########################################
lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir ruff
    - ruff check .
  artifacts:
    expire_in: 1 week
    when: always

########################################
#            UNIT TESTS
########################################
unit-test:
  stage: unit
  image: python:3.12-slim
  variables:
    PYTHONPATH: "$CI_PROJECT_DIR"
  script:
    - pip install --no-cache-dir -r requirements.txt moto pytest
    - pytest tests/unit
  needs: [lint]

########################################
#              API TESTS
########################################
api-test:
  stage: api
  image: python:3.12-slim
  variables:
    PYTHONPATH: "$CI_PROJECT_DIR"
    STORAGE_ENDPOINT: http://dummy
    STORAGE_BUCKET: firmware
    STORAGE_ACCESS_KEY_ID: dummy
    STORAGE_SECRET_ACCESS_KEY: dummy
    STORAGE_REGION: us-east-1
  script:
    - pip install --no-cache-dir -r requirements.txt pytest
    - pytest tests/api
  needs: [unit-test]

########################################
#        INTEGRATION TESTS (MinIO)
########################################
integration-test:
  stage: integration
  image: python:3.12-slim
  services:
    - name: minio/minio:latest
      alias: minio
      command: ["server","/data","--console-address",":9001"]
  variables:
    PYTHONPATH: "$CI_PROJECT_DIR"
    STORAGE_ENDPOINT: http://minio:9000
    STORAGE_BUCKET: firmware
    STORAGE_ACCESS_KEY_ID: minioadmin
    STORAGE_SECRET_ACCESS_KEY: minioadmin
    STORAGE_REGION: us-east-1
  script:
    - pip install --no-cache-dir -r requirements.txt boto3 pytest
    - pytest tests/integration
  needs: [api-test]

########################################
#        BUILD & PUSH IMAGE
########################################
build-image:
  stage: build
  image: quay.io/containers/podman:5.2         # podman + buildah + skopeo
  variables:
    BUILDAH_ISOLATION: chroot
    STORAGE_DRIVER: vfs
  script:
    # 1) login to internal registry (HTTP)
    - podman login --tls-verify=false \
        -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" \
        "$INTERNAL_REGISTRY"

    # 2) build
    - podman build --pull \
        -t "$INTERNAL_IMAGE:$CI_COMMIT_SHA" .

    # 3) push
    - podman push --tls-verify=false "$INTERNAL_IMAGE:$CI_COMMIT_SHA"
  needs: [integration-test]
